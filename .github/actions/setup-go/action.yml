name: Setup Go
description: Set up Go, uv, the native tokenizer, and Linux linker hardening.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.13"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # ubuntu-26.04 preview ships gcc defaulting to -fuse-ld=gold, but the
    # gold linker is absent, breaking cgo external links. Harmless on 24.04.
    - name: Fix external linker (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils
        echo "GOFLAGS=-ldflags=-extldflags=-fuse-ld=bfd" >> "$GITHUB_ENV"

    - name: Prepare native tokenizer
      shell: bash
      run: make tokenizer-native
