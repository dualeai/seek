name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-static:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    # ubuntu-26.04 preview lacks the gold linker; CGO_ENABLED=0 keeps the
    # pure-Go toolchain (golangci-lint, vet) off the broken external linker.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make install
      - run: make test-static

  vuln:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GOVULNCHECK_VERSION: v1.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Cache Go tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-${{ env.GOVULNCHECK_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-
      - name: Run govulncheck
        run: |
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          govulncheck -format sarif ./... > vuln.raw.sarif || true
          # govulncheck emits duplicate items in rule tags; GitHub's SARIF
          # validator rejects dups, so dedupe each tags array.
          jq '(.runs[]?.tool.driver.rules[]?.properties.tags) |= (. // [] | unique)' \
            vuln.raw.sarif > vuln.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: vuln.sarif
          category: govulncheck

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04                        # Linux x86_64 (Noble)
            name: linux-amd64-2404
          - os: ubuntu-24.04-arm                    # Linux arm64 (Noble)
            name: linux-arm64-2404
          - os: ubuntu-26.04                        # Linux x86_64 (preview)
            name: linux-amd64-2604
          - os: ubuntu-26.04-arm                    # Linux arm64 (preview)
            name: linux-arm64-2604
          - os: macos-26                            # macOS arm64 (Tahoe)
            name: macos-26-arm64
          - os: macos-15                            # macOS arm64 (Sequoia)
            name: macos-15-arm64
          - os: macos-26-intel                      # macOS x86_64 (Tahoe)
            name: macos-26-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      JUNIT_XML: junit-${{ matrix.name }}.xml
      COVERPROFILE: cover-${{ matrix.name }}.out
      GOTESTSUM_VERSION: v1.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Install unit test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq universal-ctags
      - name: Install unit test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq universal-ctags
      - name: Cache Go tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-${{ env.GOTESTSUM_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-${{ env.GOTESTSUM_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-
      - name: Install gotestsum
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install gotest.tools/gotestsum@"${GOTESTSUM_VERSION}"
      - name: Run unit tests
        # Step backstop sits above the Go test -timeout (18m, which fires first
        # with a goroutine dump) and below the job timeout, so a hung test is
        # bounded without GH hard-killing before Go can report.
        timeout-minutes: 20
        run: make test-unit
      - name: Coverage summary
        if: always()
        run: |
          if [ -f "$COVERPROFILE" ]; then
            {
              echo "### Coverage (${{ matrix.name }})"
              echo '```'
              go tool cover -func="$COVERPROFILE" | tail -1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.name }}
          path: ${{ env.JUNIT_XML }}
          if-no-files-found: ignore
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ env.COVERPROFILE }}
          if-no-files-found: ignore

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04                        # Linux x86_64 (Noble)
            name: linux-amd64-2404
          - os: ubuntu-24.04-arm                    # Linux arm64 (Noble)
            name: linux-arm64-2404
          - os: ubuntu-26.04                        # Linux x86_64 (preview)
            name: linux-amd64-2604
          - os: ubuntu-26.04-arm                    # Linux arm64 (preview)
            name: linux-arm64-2604
          - os: macos-26                            # macOS arm64 (Tahoe)
            name: macos-26-arm64
          - os: macos-15                            # macOS arm64 (Sequoia)
            name: macos-15-arm64
          - os: macos-26-intel                      # macOS x86_64 (Tahoe)
            name: macos-26-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [test-static, test-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seek-${{ matrix.name }}
          path: seek

  # Submit the Go module graph to GitHub's dependency graph so Dependabot
  # alerts work. Push-only: forked-PR runs lack write permission.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
        with:
          go-mod-path: go.mod
