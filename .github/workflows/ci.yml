name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - os: ubuntu-24.04                        # Linux x86_64 (Noble)
            name: linux-amd64-2404
          - os: ubuntu-24.04-arm                    # Linux arm64 (Noble)
            name: linux-arm64-2404
          - os: ubuntu-26.04                        # Linux x86_64 (preview)
            name: linux-amd64-2604
          - os: ubuntu-26.04-arm                    # Linux arm64 (preview)
            name: linux-arm64-2604
          - os: macos-26                            # macOS arm64 (Tahoe)
            name: macos-26-arm64
          - os: macos-15                            # macOS arm64 (Sequoia)
            name: macos-15-arm64
          - os: macos-15-intel                      # macOS x86_64 (Sequoia)
            name: macos-15-amd64
          - os: xcode-27                            # macOS arm64 (27, preview image)
            name: macos-27-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seek-${{ matrix.name }}
          path: seek

  test-static:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make install
      - run: make test-static

  vuln:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GOVULNCHECK_VERSION: v1.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Cache Go tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-${{ env.GOVULNCHECK_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-gotools-govulncheck-
      - name: Run govulncheck
        run: |
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          govulncheck -format sarif ./... > vuln.raw.sarif || true
          # govulncheck writes duplicate items in rule tags and in result
          # stacks. GitHub's SARIF validator rejects duplicates, so jq removes
          # them from both arrays.
          # TODO: remove the jq filter when these issues are fixed:
          # https://github.com/golang/go/issues/75890 (tags)
          # https://github.com/golang/go/issues/81953 (stacks)
          # https://github.com/golang/go/issues/82319 (stacks)
          jq '(.runs[]?.tool.driver.rules[]?.properties.tags) |= (. // [] | unique)
            | (.runs[]?.results[]? | select(.stacks) | .stacks) |= unique' \
            vuln.raw.sarif > vuln.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: vuln.sarif
          category: govulncheck

  test-unit:
    needs: [build]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      JUNIT_XML: junit-${{ matrix.name }}.xml
      COVERPROFILE: cover-${{ matrix.name }}.out
      GOTESTSUM_VERSION: v1.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seek-${{ matrix.name }}
          path: .
      - name: Restore executable mode
        run: chmod +x seek
      - name: Install unit test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq universal-ctags
      - name: Install unit test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq universal-ctags
      - name: Cache Go tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-${{ env.GOTESTSUM_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-${{ env.GOTESTSUM_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-gotools-gotestsum-
      - name: Install gotestsum
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install gotest.tools/gotestsum@"${GOTESTSUM_VERSION}"
      - name: Run unit tests
        # The step timeout is above the sum of the router plugin tests, the
        # -race build, and the Go test -timeout, and below the job timeout. The
        # Go test -timeout (25m) counts only the test run, and it stops the run
        # with a goroutine dump. On macOS Intel, the plugin tests took up to
        # 2 min, and the build took up to 2 min.
        timeout-minutes: 30
        run: make test-unit USE_PREBUILT=1 OUTPUT=seek
      - name: Coverage summary
        if: always()
        run: |
          if [ -f "$COVERPROFILE" ]; then
            {
              echo "### Coverage (${{ matrix.name }})"
              echo '```'
              go tool cover -func="$COVERPROFILE" | tail -1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.name }}
          path: ${{ env.JUNIT_XML }}
          if-no-files-found: ignore
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ env.COVERPROFILE }}
          if-no-files-found: ignore

  codspeed:
    name: Run benchmarks
    needs: [build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    # The benchmarks take at least 20 min here: BenchmarkSemanticModelPass100k
    # alone takes 13 min. After the run, CodSpeed runner v5.2.1 took at least
    # 16 min more.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 11
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seek-linux-arm64-2604
          path: ${{ runner.temp }}/seek-bench
      - name: Restore executable mode
        run: chmod +x "${RUNNER_TEMP}/seek-bench/seek"
      - name: Install benchmark dependency
        run: sudo apt-get install -y universal-ctags
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          go-runner-version: 1.3.0
          # The CodSpeed runner skips tests. -bench=. selects every benchmark.
          run: go test -bench=. -benchtime=1s ./cmd/seek
        env:
          CGO_ENABLED: 1
          SEEK_BENCH_BINARY: ${{ runner.temp }}/seek-bench/seek
          SEEK_BENCH_REPO: ${{ github.workspace }}

  # Send the Go module graph to GitHub's dependency graph, so that Dependabot
  # alerts work. The job runs on push only, because a run for a pull request
  # from a fork has no write permission.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
        with:
          go-mod-path: go.mod
