name: CodSpeed

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        uses: CodSpeedHQ/action@445899b9a91a42b54d787dc415eceb208810a31d # v4.17.6
        with:
          mode: walltime
          run: go test ./cmd/seek/ -bench=. -benchtime=5s -run='^$' -short
